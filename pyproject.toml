[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accent-detection-gop"
version = "1.0.0"
description = "Indian-English accent detection (WavLM / wav2vec2) and Goodness-of-Pronunciation scoring with CTC forced alignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12.1",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
espeak = ["phonemizer>=3.2"]  # also needs the espeak-ng system package
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff==0.16.9"]

[project.scripts]
accent-train = "src.train:main"
accent-evaluate = "src.evaluate:main"
accent-predict = "src.predict:main"

[tool.setuptools]
packages = ["src"]

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["slow: end-to-end tests that train a model (deselect with -m 'not slow')"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Raised inside transformers' WavLM attention on recent torch; not from this code.
    "ignore:Support for mismatched key_padding_mask and attn_mask is deprecated:UserWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

# --------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.format]
# The notebook builders are mostly notebook source held in strings: keep their layout.
exclude = ["scripts/build_nb_sec_*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "NPY", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_nb_sec_*.py" = ["E501", "E401", "E702", "F401", "I001", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
